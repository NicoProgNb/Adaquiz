<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Répliques</title>
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>

    <body>
        <header>
            <h1>Connaissez vos répliques</h1>
        </header>

        <main>
            <!-- ═══════════════════════════════════════
            ÉCRAN 1 — ACCUEIL
            Affiché au départ. Caché quand on clique sur "Commencer".
            ════════════════════════════════════════ -->
            <section id="ecran-accueil" class="ecran">
                <img src="./images/OSS117.jpg" alt="Image de l'accueil" />
                <div>
                    <p>Bienvenue ce sur petit test orienté humour.</p>
                    <p>
                        Puisqu'il n'est sûrement pas très intéressant de parler
                        mécanique moto (#concurrence), nous vous proposons de
                        passer un bon moment en vous mettant à un défi mémoire.
                    </p>
                    <p>&#128513;</p>
                    <p id="nb-questions"></p>
                </div>

                <div class="parent_btn">
                    <button id="btn-commencer">
                    COMMENCER
                    </button>
                </div>
            </section>

            <!-- ═══════════════════════════════════════
            ÉCRAN 2 — QUESTION
            Caché au départ. Affiché pendant le quiz.
            ════════════════════════════════════════ -->
            <section id="ecran-question" class="ecran cache">
                <div class="progress-container">
                    <label for="my-progress">Progression <span id="progress-text">0</span>%</label>
                    <progress id="my-progress" value="0" max="100"></progress>
                </div>
                <h2 id="question"></h2>
                <!--QUESTION-->
                <article>
                    <ul id="reponse">
                        <!-- li : Réponses -->
                    </ul>
                </article>

                <div class="parent_btn">
                    <button id="btn-suivant" class="cache">
                    SUIVANT
                    </button>
                </div>
            </section>

            <!-- ═══════════════════════════════════════
            ÉCRAN 3 — RÉSULTATS
            Caché au départ. Affiché à la fin du quiz.
            ════════════════════════════════════════ -->
            <section id="ecran-resultats" class="ecran cache">
                <p id="score"></p>
                <p id="message-fin"></p>
                <!-- Message de score -->
                <div class="parent_btn">
                    <button id="btn-recommencer">
                    RECOMMENCER
                    </button>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; Fab et Nico</p>
        </footer>

    </body>
</html>
